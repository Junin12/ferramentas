<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dividir PDF</title>
<meta name="description" content="Separe páginas ou intervalos de um PDF, direto no aparelho.">
<meta name="theme-color" content="#d93025">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../comum/base.css">
</head>
<body>
<header class="topo"><div class="in"><a class="voltar" href="../?g=pdf">‹ PDF</a><h1>Dividir PDF</h1></div></header>
<main class="wrap">
  <p class="sub">Separe páginas ou intervalos de um PDF. Nada é enviado a servidor.</p>
  <div class="drop" id="drop">
    <p id="drop-txt">Arraste um PDF para cá ou</p>
    <label class="btn pri" for="arq">Escolher PDF</label>
    <input class="sr" id="arq" type="file" accept="application/pdf,.pdf">
  </div>
  <section class="card hide" id="opcoes">
    <h2 id="arq-nome"></h2>
    <div class="opcoes" role="radiogroup" aria-label="Como dividir">
      <label><input type="radio" name="modo" value="extrair" checked><span>Um PDF com as páginas escolhidas<small>Ex.: 1-3, 7 gera um arquivo com as páginas 1, 2, 3 e 7</small></span></label>
      <label><input type="radio" name="modo" value="intervalos"><span>Um PDF para cada intervalo<small>Ex.: 1-3, 4-6 gera dois arquivos</small></span></label>
      <label><input type="radio" name="modo" value="cada"><span>Cada página num PDF separado</span></label>
    </div>
    <label class="campo" id="campo-pag">Páginas
      <input id="pags" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex.: 1-3, 5, 8-10">
    </label>
    <p class="info">Mais de um arquivo vem dentro de um .zip.</p>
  </section>
</main>
<div class="acao"><div class="in"><button class="pri" id="dividir" type="button" disabled>Dividir</button></div></div>
<div id="status" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
<script src="../comum/base.js"></script>
<script>
'use strict';
let arq = null; // {nome, bytes, total}

F.entrada(F.$('#drop'), F.$('#arq'), async ([f]) => {
  if (!F.libs('PDFLib', 'JSZip')) return;
  try {
    const bytes = await F.bytesPdf(f);
    const doc = await F.abrirPdfLib(bytes, f.name);
    arq = { nome: f.name, bytes, total: doc.getPageCount() };
    F.$('#arq-nome').textContent = `${f.name} · ${arq.total} página${arq.total > 1 ? 's' : ''}`;
    F.$('#drop-txt').textContent = 'Trocar de arquivo:';
    F.$('#opcoes').classList.remove('hide');
    F.$('#dividir').disabled = false;
  } catch (e) { F.toast(e.message, true); }
});

document.querySelectorAll('[name=modo]').forEach((r) => r.addEventListener('change', () => {
  F.$('#campo-pag').classList.toggle('hide', r.value === 'cada' && r.checked);
}));

F.$('#dividir').addEventListener('click', (e) => F.trabalhando(e.currentTarget, async (msg) => {
  const modo = document.querySelector('[name=modo]:checked').value;
  let grupos;
  if (modo === 'cada') grupos = Array.from({ length: arq.total }, (_, i) => [i]);
  else {
    if (!F.$('#pags').value.trim()) throw new Error('Informe as páginas. Ex.: 1-3, 5');
    grupos = F.intervalos(F.$('#pags').value, arq.total);
    if (modo === 'extrair') grupos = [grupos.flat()];
  }
  const src = await F.abrirPdfLib(arq.bytes, arq.nome);
  const base = F.nomeBase(arq.nome);
  const saidas = [];
  for (let k = 0; k < grupos.length; k++) {
    msg(`Gerando ${k + 1} de ${grupos.length}…`);
    const out = await PDFLib.PDFDocument.create();
    (await out.copyPages(src, grupos[k])).forEach((p) => out.addPage(p));
    const nome = modo === 'extrair' ? `${base}-paginas.pdf` : `${base}-${F.descreve(grupos[k])}.pdf`;
    saidas.push({ nome, bytes: await out.save() });
  }
  if (saidas.length === 1) {
    F.baixar(new Blob([saidas[0].bytes], { type: 'application/pdf' }), saidas[0].nome);
  } else {
    msg('Compactando…');
    const zip = new JSZip();
    saidas.forEach((s) => zip.file(s.nome, s.bytes));
    F.baixar(await zip.generateAsync({ type: 'blob' }), `${base}-dividido.zip`);
  }
  F.toast(saidas.length === 1 ? 'PDF pronto.' : `${saidas.length} PDFs prontos no .zip.`);
}));
</script>
</body>
</html>
