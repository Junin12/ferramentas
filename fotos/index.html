<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprimir fotos</title>
<meta name="description" content="Diminua e redimensione várias fotos de uma vez e converta HEIC do iPhone para JPG, direto no aparelho.">
<meta name="theme-color" content="#A8305C">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../comum/base.css">
<style>
:root{--brand:#A8305C}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.item .ok{color:var(--ok);font-weight:600}
.resumo{font-weight:600}
</style>
</head>
<body>
<header class="topo"><div class="in"><a class="voltar" href="../?g=foto">‹ Fotos</a><h1 id="tit">Comprimir fotos</h1></div></header>
<main class="wrap">
  <p class="sub" id="sub">Fotos de 4 a 8 MB viram 200 a 500 KB, boas para WhatsApp, e-mail e relatório. Fotos do iPhone (HEIC) saem em JPG. Nada é enviado a servidor.</p>
  <div class="drop" id="drop">
    <p>Arraste as fotos para cá ou</p>
    <label class="btn pri" for="arq">Escolher fotos</label>
    <input class="sr" id="arq" type="file" accept="image/*,.heic,.heif" multiple>
  </div>
  <section class="card">
    <div class="grade2">
      <label class="campo">Tamanho (lado maior)
        <select id="lado"><option value="1280">1280 px (WhatsApp)</option><option value="1600" selected>1600 px (relatório)</option><option value="2048">2048 px</option><option value="800">800 px (bem leve)</option><option value="0">Original</option></select>
      </label>
      <label class="campo">Qualidade
        <select id="qual"><option value="0.6">Menor arquivo</option><option value="0.75" selected>Boa</option><option value="0.85">Alta</option><option value="0.92">Máxima</option></select>
      </label>
      <label class="campo">Entregar
        <select id="saida"><option value="zip">Tudo num ZIP</option><option value="um">Uma por uma</option></select>
      </label>
    </div>
  </section>
  <ol class="lista" id="lista" aria-label="Fotos"></ol>
  <p class="resumo" id="resumo"></p>
</main>
<div class="acao"><div class="in">
  <button type="button" id="share" class="hide">Compartilhar</button>
  <button type="button" class="pri" id="ir" disabled>Comprimir</button>
</div></div>
<div id="status" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
<script src="../comum/base.js"></script>
<script>
'use strict';
const lista = []; let prontas = [];
// ?modo=heic: só converte, sem diminuir
if (new URLSearchParams(location.search).get('modo') === 'heic') {
  document.title = 'HEIC para JPG'; F.$('#tit').textContent = 'HEIC para JPG';
  F.$('#sub').textContent = 'Fotos do iPhone (HEIC) viram JPG, que abre em qualquer computador e no WhatsApp. Nada é enviado a servidor.';
  F.$('#lado').value = '0'; F.$('#qual').value = '0.92'; F.$('#ir').textContent = 'Converter';
}
const ehHeic = (f) => /hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name);
F.entrada(F.$('#drop'), F.$('#arq'), (fs) => {
  for (const f of fs) { if (!f.type.startsWith('image/') && !ehHeic(f)) { F.toast(`“${f.name}” não é foto.`, true); continue; } lista.push({ f, st: '' }); }
  prontas = []; desenhar();
});
function desenhar() {
  F.$('#lista').replaceChildren(...lista.map((x, k) => {
    const li = document.createElement('li'); li.className = 'item';
    li.innerHTML = '<div class="nm"><b></b><small></small></div><button type="button" class="mini" aria-label="Tirar">✕</button>';
    li.querySelector('b').textContent = x.f.name; li.querySelector('small').textContent = F.tamanho(x.f.size) + (x.st ? ' → ' : '');
    if (x.st) { const s = document.createElement('span'); s.className = x.erro ? '' : 'ok'; s.textContent = x.st; li.querySelector('small').append(s); }
    li.querySelector('button').onclick = () => { lista.splice(k, 1); prontas = []; desenhar(); };
    return li;
  }));
  F.$('#ir').disabled = !lista.length;
}
// HEIC: o Safari abre direto; nos outros navegadores usa o heic2any (carregado só quando precisa)
async function abrir(f) {
  try { return await createImageBitmap(f); }
  catch (e) {
    if (!ehHeic(f)) throw new Error('não consegui abrir');
    if (!window.heic2any) await new Promise((ok, erro) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'; s.onload = ok; s.onerror = () => erro(new Error('sem internet para o conversor de HEIC')); document.head.append(s); });
    const b = await window.heic2any({ blob: f, toType: 'image/jpeg', quality: 0.95 });
    return createImageBitmap(Array.isArray(b) ? b[0] : b);
  }
}
// reduz em etapas (metade por vez): a foto fica mais nítida que numa redução direta
function reduzir(bmp, lado) {
  let w = bmp.width, h = bmp.height; const k = lado ? Math.min(1, lado / Math.max(w, h)) : 1, W = Math.round(w * k), H = Math.round(h * k);
  let src = bmp;
  while (w / 2 > W) { w = Math.round(w / 2); h = Math.round(h / 2); const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, w, h); src = c; }
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, W, H);
  return c;
}
F.$('#ir').addEventListener('click', () => F.trabalhando(F.$('#ir'), async (msg) => {
  const lado = +F.$('#lado').value, q = +F.$('#qual').value; prontas = []; let antes = 0, depois = 0;
  for (const [k, x] of lista.entries()) {
    msg(`Foto ${k + 1} de ${lista.length}…`);
    try {
      const bmp = await abrir(x.f), c = reduzir(bmp, lado), larg0 = bmp.width; bmp.close?.();
      let b = await F.jpeg(c, q);
      // foto já leve e sem redução: fica a original (recomprimir só pioraria)
      if (b.size >= x.f.size && !ehHeic(x.f) && /jpe?g/i.test(x.f.type) && c.width === larg0) b = x.f;
      prontas.push({ nome: F.nomeBase(x.f.name) + '.jpg', b }); antes += x.f.size; depois += b.size;
      x.st = `${F.tamanho(b.size)} · ${c.width}×${c.height}`; x.erro = false;
    } catch (e) { x.st = 'não consegui abrir esta foto'; x.erro = true; }
    desenhar();
  }
  if (!prontas.length) return;
  F.$('#resumo').textContent = `${F.tamanho(antes)} → ${F.tamanho(depois)} (${Math.round((1 - depois / antes) * 100)}% menor)`;
  F.$('#share').classList.toggle('hide', !navigator.canShare?.({ files: prontas.map((p) => new File([p.b], p.nome, { type: 'image/jpeg' })) }));
  if (F.$('#saida').value === 'zip' && prontas.length > 1 && window.JSZip) {
    msg('Montando o ZIP…'); const z = new JSZip(); const usados = new Set();
    for (const p of prontas) { let n = p.nome, i = 2; while (usados.has(n)) n = p.nome.replace(/\.jpg$/, `_${i++}.jpg`); usados.add(n); z.file(n, p.b); }
    F.baixar(await z.generateAsync({ type: 'blob' }), `Fotos_${new Date().toISOString().slice(0, 10)}.zip`);
  } else for (const p of prontas) F.baixar(p.b, p.nome);
}));
F.$('#share').addEventListener('click', () => navigator.share({ files: prontas.map((p) => new File([p.b], p.nome, { type: 'image/jpeg' })) }).catch(() => {}));
</script>
</body>
</html>
