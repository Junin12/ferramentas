<title>Ferramentas WiApps</title>
<meta name="description" content="Ferramentas que rodam no seu aparelho: editar PDF, converter para Word e mais. Nenhum arquivo é enviado a servidor.">
<meta name="theme-color" content="#1F3A5F">
<link rel="canonical" href="https://wiapps.com.br/ferramentas/">

<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1d2330;--muted:#5b6475;--line:#d9dde4;--brand:#1F3A5F;--focus:#1a73e8}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171c;--panel:#1f242c;--ink:#e8eaee;--muted:#a0a8b6;--line:#343b47;--brand:#8ab4f8;--focus:#8ab4f8}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:4px 0 4px;font-size:24px}
h1 b{color:var(--brand)}
.sub{color:var(--muted);margin:0 0 20px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ferr{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;min-height:84px}
.ferr:hover{border-color:var(--brand)}
.busca{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:0 16px;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.busca:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.busca svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.busca input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;padding:12px 0;outline:none}
.vazio{grid-column:1/-1;color:var(--muted);padding:12px 4px}
.ferr .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ferr .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ferr b{display:block;margin-bottom:2px}
.ferr small{color:var(--muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rodape{color:var(--muted);font-size:13px;margin-top:28px}
.voltar{display:inline-flex;align-items:center;min-height:38px;color:var(--muted);text-decoration:none}
.voltar:hover{color:var(--ink)}
[hidden]{display:none!important}
.embutido .rodape{display:none}
</style>
</head>

// aberto de dentro de outro app (ex.: ?de=wigo): vale para a sessão toda, inclusive dentro das ferramentas
const de = new URLSearchParams(location.search).get('de');
try { if (de) sessionStorage.setItem('ferr-de', de); } catch (e) { /* sem armazenamento: segue normal */ }
if (de || window !== window.top) document.documentElement.classList.add('embutido');
// dentro de outro app (iframe): trocar de página sem empilhar no histórico, para o Voltar do celular fechar as ferramentas
if (window !== window.top) document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (a && a.origin === location.origin && !a.target && !a.hasAttribute('download')) { e.preventDefault(); location.replace(a.href); }
});

function cartao(href, f) {
  const a = document.createElement('a');
  a.className = 'ferr';
  a.href = href;
  a.style.setProperty('--c1', f.c[0]);
  a.style.setProperty('--c2', f.c[1]);
  a.innerHTML = `<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${f.ico}</svg></span><span><b></b><small></small></span>`;
  a.querySelector('b').textContent = f.nome;
  a.querySelector('small').textContent = f.desc;
  return a;
}

// busca: nome, descrição e grupo de cada ferramenta (sem acento, com um erro de digitação por palavra de 4+ letras)
const sem = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const quase = (a, b) => { if (Math.abs(a.length - b.length) > 1) return false; let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++d > 1) return false;
    if (a.length === b.length && a[i] === b[j + 1] && a[i + 1] === b[j]) { i += 2; j += 2; } else if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } }
  return d + (a.length - i) + (b.length - j) <= 1; };
function nota(q, f) {
  const g = GRUPOS.find((x) => x.id === f.grupo), t = sem(`${f.nome} ${f.desc} ${g ? g.nome : ''}`), ws = t.split(/[^a-z0-9]+/).filter(Boolean); let n = 0;
  for (const p of sem(q).split(/\s+/).filter(Boolean)) {
    if (sem(f.nome).includes(p)) n += 4; else if (ws.some((w) => w.startsWith(p))) n += 3; else if (t.includes(p)) n += 2;
    else if (p.length >= 4 && ws.some((w) => quase(p, w) || quase(p, w.slice(0, p.length + 1)))) n += 1; else return 0;
  }
  return n;
}
const qBusca = document.getElementById('q');
function buscar() {
  const q = qBusca.value.trim(), grade = document.getElementById('grade');
  if (q.length < 2) { grade.replaceChildren(...telaGrupos()); return; }
  const achou = FERRAMENTAS.map((f) => [nota(q, f), f]).filter((x) => x[0]).sort((a, b) => b[0] - a[0]).map((x) => cartao(x[1].pasta, x[1]));
  const n = document.createElement('a'); n.className = 'ferr'; n.href = 'normas/?q=' + encodeURIComponent(q);
  n.innerHTML = '<span class="ic" style="--c1:#4E7A7E;--c2:#2F5D62"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><span><b></b><small>Procurar também dentro dos cards das normas</small></span>';
  n.querySelector('b').textContent = `“${q}” nas normas`;
  const v = document.createElement('p'); v.className = 'vazio'; v.textContent = `Nenhuma ferramenta com “${q}”.`;
  grade.replaceChildren(...(achou.length ? achou : [v]), n);
}
let tmBusca; qBusca.addEventListener('input', () => { clearTimeout(tmBusca); tmBusca = setTimeout(buscar, 120); });

const grupo = GRUPOS.find((g) => g.id === new URLSearchParams(location.search).get('g'));
const telaGrupos = () => grupo ? FERRAMENTAS.filter((f) => f.grupo === grupo.id).map((f) => cartao(f.pasta, f))
  : GRUPOS.map((g) => { const fs = FERRAMENTAS.filter((f) => f.grupo === g.id); return cartao(fs.length === 1 ? fs[0].pasta : `./?g=${g.id}`, g); });
if (grupo) {
  document.title = `${grupo.nome} · Ferramentas WiApps`;
  document.getElementById('titulo').textContent = grupo.nome;
  document.getElementById('voltar').hidden = false;
  document.getElementById('grade').replaceChildren(...FERRAMENTAS.filter((f) => f.grupo === grupo.id).map((f) => cartao(f.pasta, f)));
} else {
  // grupo com uma ferramenta só abre direto nela
  document.getElementById('grade').replaceChildren(...GRUPOS.map((g) => {
    const fs = FERRAMENTAS.filter((f) => f.grupo === g.id);
    return cartao(fs.length === 1 ? fs[0].pasta : `./?g=${g.id}`, g);
  }));
}

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW não registrado', e));
}
