<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de obra</title>
<meta name="description" content="Cubicagem de caminhão, tijolos, concreto, aço, vala, argamassa, piso, pintura e mais: cálculos de obra no celular.">
<meta name="theme-color" content="#B5651D">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../comum/base.css">
<style>
:root{--brand:#B5651D}
@media (prefers-color-scheme:dark){:root{--brand:#E39A55;--brand-ink:#1d1206}}
[hidden]{display:none!important}
.topo h1{flex:1}
.grupo-tit{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 -4px}
.calcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.calc{display:grid;grid-template-rows:auto auto 1fr;gap:2px;text-align:left;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.calc:hover{border-color:var(--brand)}
.calc svg{width:100%;height:84px;margin-bottom:4px}
.calc small{color:var(--muted);font-size:12.5px;line-height:1.3}
/* formulário */
.secao{font-size:15px;margin:6px 0 -2px;color:var(--brand)}
.campo .un{color:var(--muted);font-size:13px}
.campo .dica{font-size:12.5px;color:var(--muted)}
.campo-in{display:flex;align-items:center;gap:6px}
.campo-in input{flex:1}
.escolhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.escolhas.sem-des{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.op{display:grid;gap:2px;align-content:start;text-align:left;white-space:normal;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--panel);min-height:0;line-height:1.25;justify-content:stretch;position:relative}
.op svg{width:100%;height:78px}
.op small{color:var(--muted);font-size:12px}
.op[aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.op[aria-checked="true"]::after{content:"✓";position:absolute;top:6px;right:8px;background:var(--brand);color:var(--brand-ink);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:700}
.des-campo svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.pontos{display:grid;gap:8px}
.pontos svg{width:100%;max-width:360px;height:auto;margin:0 auto;display:block}
.pontos .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pontos label{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.pontos input{font:inherit;font-size:18px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:42px;width:100%}
.lin{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr)) auto;gap:6px;align-items:end}
.lin label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.lin input,.lin select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:40px;width:100%}
/* resultado */
#res .dest{font-size:30px;font-weight:700;line-height:1.1;color:var(--brand)}
#res .sub2{color:var(--muted)}
#res .erro{color:var(--muted);font-style:italic}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.chip.ok{background:#1e7d3222;color:var(--ok)}.chip.bad{background:#b3261e22;color:#b3261e}
@media (prefers-color-scheme:dark){.chip.bad{color:#f28b82}}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab th,.tab td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tab th{color:var(--muted);font-weight:500;width:44%}
.tab.grade th{width:auto;font-weight:600}
.avisos{margin:0;padding-left:18px;color:#a35a00;font-size:13.5px}
@media (prefers-color-scheme:dark){.avisos{color:#f2b56b}}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acoes .pri{grid-column:1/-1}
.res-des{display:flex;gap:8px;overflow-x:auto}
.res-des svg{height:84px;width:auto;flex:none;background:var(--bg);border-radius:8px}
#barra .in{justify-content:space-between}
#barra b{font-size:20px;color:var(--brand);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .item{cursor:pointer}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <a class="voltar" id="voltar" href="../?g=obra">‹ Obra</a>
  <h1 id="titulo">Calculadora de obra</h1>
</div></header>
<main class="wrap" id="main"></main>
<div class="acao" id="barra" hidden><div class="in">
  <b id="barra-dest">—</b>
  <button type="button" class="pri" id="barra-ir" style="flex:0 0 auto">Ver resultado ↓</button>
</div></div>
<div id="status" role="status" aria-live="polite"></div>
<script src="../comum/base.js"></script>
<script src="desenhos.js"></script>
<script src="calcs.js"></script>
<script src="app.js"></script>
</body>
</html>
